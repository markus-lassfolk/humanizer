# Full EN/SV data pipelines (no --with-lm, no Wikipedia extended). Uploads logs
# and reports; opens an issue when any matrix leg fails.
name: Nightly pipelines

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  pipeline:
    name: pipeline (${{ matrix.pipeline }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pipeline: [sv, en]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: npm install

      - name: Swedish pipeline
        if: matrix.pipeline == 'sv'
        run: npm run sv:pipeline

      - name: English pipeline
        if: matrix.pipeline == 'en'
        run: npm run en:pipeline

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nightly-${{ matrix.pipeline }}-reports
          retention-days: 14
          if-no-files-found: ignore
          path: |
            reports/
            locales/sv-se/references/PIPELINE-SNAPSHOT.md
            locales/sv-se/.pipeline/last-run.log
            locales/en-en/references/PIPELINE-SNAPSHOT.md
            locales/en-en/.pipeline/last-run.log

  notify:
    name: Open issue on failure
    needs: [pipeline]
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[nightly] Pipeline failed (${new Date().toISOString().slice(0, 10)})`,
              body: [
                'The scheduled **Nightly pipelines** workflow failed.',
                '',
                `- Workflow run: ${runUrl}`,
                '- Download artifacts `nightly-sv-reports` / `nightly-en-reports` from the run for logs and snapshots.',
                '',
                'Close this issue after fixing or if the failure was transient.',
              ].join('\n'),
            });
